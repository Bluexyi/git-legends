# =====================================================================
#  Déploiement automatique du site de l'équipe sur Azure
# ---------------------------------------------------------------------
#  À chaque push sur main :
#    1. on récupère le code,
#    2. on vérifie les variables du dépôt,
#    3. on personnalise le site avec ces variables,
#    4. on envoie les fichiers dans le dossier du groupe sur Azure.
#
#  Variables du dépôt (Settings > Secrets and variables > Actions > Variables) :
#    CLASS_NAME    ex. SRC1
#    GROUP_NAME    ex. G2
#    TEAM_MEMBERS  ex. Jean Dupont, Marie Martin, Paul Durand
#
#  Secret du dépôt (onglet Secrets) :
#    AZURE_STORAGE_SAS_TOKEN   fourni par l'enseignant, propre à votre groupe
# =====================================================================

name: Déploiement du site

on:
  push:
    branches: [main]
  workflow_dispatch: # permet aussi de relancer le déploiement à la main (onglet Actions)

# Permissions minimales : le pipeline a seulement besoin de lire le code.
permissions:
  contents: read

# Un seul déploiement à la fois : si deux push arrivent coup sur coup,
# le plus récent attend la fin du précédent.
concurrency:
  group: deploiement

env:
  # Préfixe des comptes de stockage de l'enseignant : NE PAS MODIFIER.
  STORAGE_PREFIX: stesgitpgit
  # Les trois variables du dépôt, disponibles pour toutes les étapes.
  CLASS_NAME: ${{ vars.CLASS_NAME }}
  GROUP_NAME: ${{ vars.GROUP_NAME }}
  TEAM_MEMBERS: ${{ vars.TEAM_MEMBERS }}

jobs:
  deploy:
    name: Construire et déployer
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v6

      - name: Vérifier les variables et le secret
        env:
          SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
        run: |
          erreur=0
          if [[ ! "$CLASS_NAME" =~ ^SRC[A-Z0-9]{1,6}$ ]]; then
            echo "::error::CLASS_NAME doit être le nom de la classe en majuscules, ex. SRC1 ou SRCRJ (valeur actuelle : '$CLASS_NAME')."
            erreur=1
          fi
          if [[ ! "$GROUP_NAME" =~ ^G([1-9]|1[0-5])$ ]]; then
            echo "::error::GROUP_NAME doit valoir G1 à G15 (valeur actuelle : '$GROUP_NAME')."
            erreur=1
          fi
          if [[ -z "${TEAM_MEMBERS// /}" ]]; then
            echo "::error::TEAM_MEMBERS est vide : indiquez les membres séparés par des virgules."
            erreur=1
          fi
          # On teste seulement que le secret existe, sans jamais l'afficher.
          if [[ -z "$SAS_TOKEN" ]]; then
            echo "::error::Le secret AZURE_STORAGE_SAS_TOKEN n'est pas configuré."
            erreur=1
          fi
          exit $erreur

      - name: Personnaliser le site
        run: |
          # On travaille sur une copie du site, dans le dossier dist/.
          rm -rf dist
          cp -r site dist

          # jq fabrique un JSON propre (guillemets et accents gérés correctement).
          jq -n \
            --arg className "$CLASS_NAME" \
            --arg groupName "$GROUP_NAME" \
            --arg members "$TEAM_MEMBERS" \
            --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_NUMBER" \
            --arg actor "$GITHUB_ACTOR" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              className: $className,
              groupName: $groupName,
              members: ($members | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))),
              build: { commit: $commit, run: $run, actor: $actor, date: $date }
            }' > dist/team.json

          # Le site lit sa configuration dans js/config.js.
          echo "window.TEAM_CONFIG = $(cat dist/team.json);" > dist/js/config.js

          echo "Configuration générée :"
          cat dist/team.json

      - name: Déployer sur Azure
        env:
          # L'outil az lit ces deux variables pour s'authentifier.
          # GitHub masque automatiquement la valeur du secret dans les logs.
          AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
        run: |
          # Compte de la classe : préfixe + classe en minuscules (ex. stesgitpgitsrc2).
          export AZURE_STORAGE_ACCOUNT="${STORAGE_PREFIX}${CLASS_NAME,,}"

          # Envoi de dist/ dans le dossier du groupe du conteneur $web.
          #   --overwrite        : remplace les fichiers du déploiement précédent
          #   no-cache           : le navigateur vérifie toujours la dernière version
          # Le jeton ne donne accès QU'AU dossier du groupe : impossible d'écrire ailleurs.
          az storage blob upload-batch \
            --destination '$web' \
            --destination-path "$GROUP_NAME" \
            --source dist \
            --overwrite \
            --content-cache-control "no-cache" \
            --only-show-errors \
            --output none

          echo "### ✅ Site déployé" >> "$GITHUB_STEP_SUMMARY"
          echo "Classe **$CLASS_NAME**, groupe **$GROUP_NAME** : ouvrez l'URL de votre fiche, qui se termine par \`/$GROUP_NAME/\`." >> "$GITHUB_STEP_SUMMARY"
